name: Build All Platforms & Deploy to itch.io

on:
  push:
    branches:
      - main
      - dev

jobs:
  build-and-deploy:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: WebGL
            channel: html
            package: build/WebGL/WebGL
          - platform: StandaloneLinux64
            channel: linux
            package: build/StandaloneLinux64
          - platform: StandaloneOSX
            channel: mac
            package: build/StandaloneOSX
          - platform: StandaloneWindows64
            channel: windows
            package: build/StandaloneWindows64

    steps:
      # 1. Descargar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. Caché de la carpeta Library por plataforma
      - name: Cache Unity Library (${{ matrix.platform }})
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.platform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.platform }}-

      # 3. Compilar cada plataforma
      - name: Build Unity (${{ matrix.platform }})
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.platform }}
          buildsPath: build

      # 4. Definir el nombre del canal según la rama (main vs develop)
      - name: Set itch.io channel
        id: set-channel
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            echo "target_channel=${{ matrix.channel }}" >> $GITHUB_OUTPUT
          else
            echo "target_channel=${{ matrix.channel }}-dev" >> $GITHUB_OUTPUT
          fi

      # 5. Subir a itch.io en push a main o develop
      - name: Push to itch.io (${{ steps.set-channel.outputs.target_channel }})
        if: github.event_name == 'push'
        uses: yeslayla/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: ${{ steps.set-channel.outputs.target_channel }}
          ITCH_USER: tahiel001
          ITCH_GAME: necrothief
          PACKAGE: ${{ matrix.package }}